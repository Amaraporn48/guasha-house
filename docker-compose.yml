version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guasha_house_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist uploaded slips and images across container rebuilds
      - ./static/uploads:/app/static/uploads
    environment:
      - ENVIRONMENT=production
      - PORT=8000
